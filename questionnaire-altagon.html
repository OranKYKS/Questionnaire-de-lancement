  --accent-border: #93c5fd;
  --gold: #b8860b;

  --radius: 10px;
  --radius-lg: 14px;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #14130f;

    --surface-2: #28261f;
    --border: rgba(255,255,255,0.12);

    --text: #ebe9e2;
    --text-2: #b5b2a8;

*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);line-height:1.5;-webkit-font-smoothing:antialiased}
#app{max-width:700px;margin:0 auto;padding:1.5rem 1rem}
@media (max-width:480px){#app{padding:1rem 0.75rem}}

.q-card{background:var(--surface);border:0.5px solid var(--border);border-radius:var(--radius-lg);padding:1.25rem;margin-bottom:1rem}
.q-question{font-size:15px;font-weight:500;margin:0 0 0.75rem;color:var(--text);line-height:1.5}
.q-hint{font-size:12px;color:var(--text-3);margin:0.5rem 0 0;font-style:italic}

.q-pills{display:flex;flex-wrap:wrap;gap:8px}
.q-pill{padding:8px 14px;border:0.5px solid var(--border);border-radius:var(--radius);background:transparent;cursor:pointer;font-size:13px;font-family:inherit;color:var(--text);transition:all 0.15s}
.q-pill:hover{border-color:var(--border-strong);background:var(--surface-2)}
.q-pill[aria-pressed="true"]{background:var(--accent-bg);border-color:var(--accent-border);color:var(--accent);font-weight:500}

.q-input,.q-textarea,.q-select{width:100%;padding:10px 12px;border:0.5px solid var(--border);border-radius:var(--radius);font-size:14px;font-family:inherit;background:var(--surface);color:var(--text);box-sizing:border-box}
.q-textarea{min-height:80px;resize:vertical;line-height:1.5}
.q-input:focus,.q-textarea:focus,.q-select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-bg)}

.q-range-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.q-range-row input[type="range"]{flex:1;min-width:140px}
.q-range-val{font-size:14px;font-weight:500;min-width:40px;text-align:right;color:var(--accent)}

.q-progress{position:sticky;top:0;background:var(--bg);padding:0.75rem 0;z-index:10;border-bottom:0.5px solid var(--border);margin-bottom:1rem}
.q-progress-bar{height:4px;background:var(--surface-2);border-radius:2px;overflow:hidden}
.q-progress-fill{height:100%;background:var(--accent);transition:width 0.3s}
.q-progress-text{font-size:12px;color:var(--text-2);margin-top:6px}

.q-btn{padding:10px 18px;border:0.5px solid var(--border-strong);border-radius:var(--radius);background:transparent;cursor:pointer;font-size:14px;font-family:inherit;color:var(--text);transition:all 0.15s}
.q-btn:hover{background:var(--surface-2)}
.q-btn-primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.q-btn-primary:hover{opacity:0.9;background:var(--accent)}
.q-btn-primary:disabled{opacity:0.4;cursor:not-allowed}

.q-formule-card{background:var(--surface);border:0.5px solid var(--border);border-radius:var(--radius-lg);padding:1rem;margin-bottom:0.75rem}
.q-formule-card.recommended{border:2px solid var(--gold);position:relative}
.q-formule-card.recommended::before{content:"Cordée recommandée";position:absolute;top:-10px;left:50%;transform:translateX(-50%);background:var(--gold);color:#fff;font-size:10px;padding:3px 10px;border-radius:var(--radius);letter-spacing:0.5px;text-transform:uppercase;font-weight:500}
.q-formule-name{font-size:17px;font-weight:500;margin:0;font-family:Georgia,serif}
.q-formule-duree{font-size:11px;color:var(--text-3);text-transform:uppercase;letter-spacing:0.5px}

.q-formule-reduc{font-size:11px;color:var(--accent);margin:0 0 0.5rem;font-weight:500}

.q-tarifs{display:flex;gap:8px;margin:0.75rem 0}
.q-tarif-box{flex:1;background:var(--surface-2);border-radius:var(--radius);padding:10px;text-align:center}
.q-tarif-box.pro{background:var(--accent-bg);border:0.5px solid var(--accent-border)}
.q-tarif-label{font-size:10px;color:var(--text-3);text-transform:uppercase;letter-spacing:0.5px}
.q-tarif-box.pro .q-tarif-label{color:var(--accent)}
.q-tarif-val{font-size:20px;font-weight:500;color:var(--text);font-family:Georgia,serif}
.q-tarif-box.pro .q-tarif-val{color:var(--accent)}
.q-tarif-unit{font-size:11px;color:var(--text-2)}

.q-features{list-style:none;padding:0;margin:0.5rem 0 0;font-size:12px;color:var(--text-2)}
.q-features li{padding:3px 0;display:flex;align-items:flex-start;gap:6px}
.q-features li i{font-size:14px;color:var(--accent);margin-top:1px;flex-shrink:0}

.q-pro-extras{background:var(--accent-bg);border-radius:var(--radius);padding:12px;margin-top:10px;font-size:12px;color:var(--accent);line-height:1.7}
.q-pro-extras strong{display:block;margin-bottom:6px;font-size:13px}

.q-header{text-align:center;margin-bottom:1.5rem}
.q-header h1{font-size:24px;font-weight:500;margin:0 0 0.5rem;font-family:Georgia,serif}
.q-header p{font-size:14px;color:var(--text-2);margin:0;line-height:1.6}

.q-share-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:1rem;justify-content:center}
.q-share-btn{display:flex;align-items:center;gap:6px;padding:9px 14px;border:0.5px solid var(--border);border-radius:var(--radius);background:transparent;cursor:pointer;font-size:13px;font-family:inherit;color:var(--text);text-decoration:none;transition:all 0.15s}
.q-share-btn:hover{background:var(--surface-2);border-color:var(--border-strong)}
.q-share-btn i{font-size:16px}

.q-metric-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:1.5rem}
.q-metric{background:var(--surface);border:0.5px solid var(--border);border-radius:var(--radius);padding:1rem}
.q-metric-label{font-size:12px;color:var(--text-2);margin-bottom:4px}
.q-metric-val{font-size:24px;font-weight:500;color:var(--text);font-family:Georgia,serif}

.q-bar-row{display:flex;align-items:center;gap:10px;margin-bottom:6px;font-size:13px}
.q-bar-label{min-width:140px;color:var(--text-2);font-size:12px}
.q-bar-track{flex:1;height:22px;background:var(--surface-2);border-radius:4px;overflow:hidden}
.q-bar-fill{height:100%;background:var(--accent);transition:width 0.5s}
.q-bar-val{min-width:65px;text-align:right;font-size:12px;font-weight:500;color:var(--accent)}

.q-tabs{display:flex;gap:4px;border-bottom:0.5px solid var(--border);margin-bottom:1rem;overflow-x:auto;-webkit-overflow-scrolling:touch}
.q-tab{padding:8px 14px;border:none;background:transparent;cursor:pointer;font-size:13px;font-family:inherit;color:var(--text-2);border-bottom:2px solid transparent;white-space:nowrap}
.q-tab.active{color:var(--accent);border-bottom-color:var(--accent)}

.q-toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 18px;border-radius:var(--radius);font-size:13px;z-index:100;opacity:0;transition:opacity 0.3s;pointer-events:none}

function afficherItem(item) {
  if (item.type === "formules-display") {

      <div class="q-card">
        <p class="q-question">${item.q}</p>
        ${CONFIG.formules.map(f => `
          <div class="q-formule-card ${f.recommande ? 'recommended' : ''}">
            <div>
              <span class="q-formule-duree">${f.duree}</span>

            ${f.reduction ? `<p class="q-formule-reduc">${f.reduction}</p>` : ''}
            <div class="q-tarifs">
              <div class="q-tarif-box">
                <div class="q-tarif-label">${LIBELLES.texteAmateur}</div>
                <div class="q-tarif-val">${f.tarifAmateur} €</div>
                <div class="q-tarif-unit">${LIBELLES.texteParMois}</div>
              </div>
              <div class="q-tarif-box pro">
                <div class="q-tarif-label">${LIBELLES.texteProfessionnel}</div>
                <div class="q-tarif-val">${f.tarifPro} €</div>
                <div class="q-tarif-unit">${LIBELLES.texteParMois}</div>
              </div>
            </div>
            <ul class="q-features">
              ${f.avantages.map(av => `<li><i class="ti ti-check"></i>${av}</li>`).join('')}
            </ul>
          </div>
        `).join('')}
        <div class="q-pro-extras">
          <strong>${LIBELLES.texteTarifAvecPro}</strong>
          ${CONFIG.avantagesProSupplementaires.map(e => `• ${e}`).join('<br>')}
        </div>
      </div>
    `;
  }

  const valeur = etat.reponses[item.id];
  let htmlChamp = '';

  if (item.type === "pills") {
    htmlChamp = `<div class="q-pills" data-id="${item.id}" data-type="pills">
      ${item.options.map(opt => `<button type="button" class="q-pill" data-value="${echapper(opt)}" aria-pressed="${valeur === opt ? 'true' : 'false'}">${opt}</button>`).join('')}
    </div>`;
  } else if (item.type === "multi-pills" || item.type === "multi-pills-limit") {
    const selectionnes = Array.isArray(valeur) ? valeur : [];
    htmlChamp = `<div class="q-pills" data-id="${item.id}" data-type="${item.type}" ${item.limit ? `data-limit="${item.limit}"` : ''}>
      ${item.options.map(opt => `<button type="button" class="q-pill" data-value="${echapper(opt)}" aria-pressed="${selectionnes.includes(opt) ? 'true' : 'false'}">${opt}</button>`).join('')}
    </div>${item.limit ? `<p class="q-hint">${LIBELLES.texteMaxSelections} ${item.limit} ${LIBELLES.texteSelectionsRestantes}</p>` : ''}`;
  } else if (item.type === "text") {
    htmlChamp = `<input type="text" class="q-input" data-id="${item.id}" placeholder="${item.placeholder || ''}" value="${valeur || ''}">`;
  } else if (item.type === "number") {
    htmlChamp = `<div style="display:flex;align-items:center;gap:8px"><input type="number" class="q-input" data-id="${item.id}" placeholder="${item.placeholder || ''}" value="${valeur || ''}" style="flex:1">${item.unit ? `<span style="font-size:14px;color:var(--text-2)">${item.unit}</span>` : ''}</div>`;
  } else if (item.type === "textarea") {
    htmlChamp = `<textarea class="q-textarea" data-id="${item.id}" placeholder="${item.placeholder || ''}">${valeur || ''}</textarea>`;
  } else if (item.type === "select") {
    htmlChamp = `<select class="q-select" data-id="${item.id}">
      <option value="">${LIBELLES.texteChoisir}</option>
      ${item.options.map(opt => `<option value="${echapper(opt)}" ${valeur === opt ? 'selected' : ''}>${opt}</option>`).join('')}
    </select>`;
  } else if (item.type === "range") {
    const v = valeur !== undefined ? valeur : item.default;
    htmlChamp = `
      <div class="q-range-row">
        <span style="font-size:11px;color:var(--text-3)">${item.labels[0]}</span>
        <input type="range" data-id="${item.id}" min="${item.min}" max="${item.max}" step="1" value="${v}" oninput="document.querySelector('[data-range-val=&quot;${item.id}&quot;]').textContent=this.value">
        <span style="font-size:11px;color:var(--text-3)">${item.labels[1]}</span>
        <span class="q-range-val" data-range-val="${item.id}">${v}</span>
      </div>`;
  }

  return `<div class="q-card"><p class="q-question">${item.q}</p>${htmlChamp}</div>`;
}

function echapper(s) {
  return String(s).replace(/"/g, '&quot;');
}

function attacherEcouteurs() {
  document.querySelectorAll('.q-pills').forEach(conteneur => {
    const id = conteneur.dataset.id;
    const type = conteneur.dataset.type;
    const limite = conteneur.dataset.limit ? parseInt(conteneur.dataset.limit) : null;
    
    conteneur.querySelectorAll('.q-pill').forEach(pastille => {
      pastille.addEventListener('click', () => {
        const val = pastille.dataset.value;
        if (type === "pills") {
          conteneur.querySelectorAll('.q-pill').forEach(p => p.setAttribute('aria-pressed', 'false'));
          pastille.setAttribute('aria-pressed', 'true');
          etat.reponses[id] = val;
        } else {
          let actuel = Array.isArray(etat.reponses[id]) ? etat.reponses[id] : [];
          if (actuel.includes(val)) {
            actuel = actuel.filter(v => v !== val);
            pastille.setAttribute('aria-pressed', 'false');
          } else {
            if (limite && actuel.length >= limite) {
              afficherMessage(`${LIBELLES.texteMaxSelections} ${limite} ${LIBELLES.texteSelectionsRestantes}`);
              return;
            }
            actuel.push(val);
            pastille.setAttribute('aria-pressed', 'true');
          }
          etat.reponses[id] = actuel;
        }
      });
    });
  });

  document.querySelectorAll('.q-input, .q-textarea, .q-select').forEach(el => {
    el.addEventListener('change', () => { etat.reponses[el.dataset.id] = el.value; });
  });

  document.querySelectorAll('input[type="range"]').forEach(el => {
    el.addEventListener('change', () => { etat.reponses[el.dataset.id] = parseInt(el.value); });
    if (etat.reponses[el.dataset.id] === undefined) etat.reponses[el.dataset.id] = parseInt(el.value);
  });
}

window.sectionSuivante = function() {

  }
};

window.sectionPrecedente = function() {
  if (etat.sectionActuelle > 0) {

};

function envoyerReponses() {
  const donnees = {
    id: "reponse_" + Date.now() + "_" + Math.random().toString(36).slice(2,8),
    horodatage: new Date().toISOString(),
    reponses: etat.reponses
  };
  
  // Sauvegarde locale d'abord
  try {
    sauvegarderReponse(donnees);
  } catch(e) {
    console.error("Erreur sauvegarde locale:", e);
  }
  
  // Envoi à l'endpoint de centralisation si configuré
  if (ENDPOINT_CENTRALISATION && ENDPOINT_CENTRALISATION !== null) {
    
    // Méthode universelle : formulaire invisible (contourne les erreurs CORS)
    const formulaireCache = document.createElement('form');
    formulaireCache.method = 'POST';
    formulaireCache.action = ENDPOINT_CENTRALISATION;
    formulaireCache.target = 'envoi_cache'; // iframe invisible
    
    // Créer une iframe invisible pour recevoir la réponse
    let iframe = document.getElementById('envoi_cache');
    if (!iframe) {
      iframe = document.createElement('iframe');
      iframe.name = 'envoi_cache';
      iframe.id = 'envoi_cache';
      iframe.style.display = 'none';
      document.body.appendChild(iframe);
    }
    
    // Ajouter l'ID et l'horodatage
    const ajouterChamp = (nom, valeur) => {
      const input = document.createElement('input');
      input.type = 'hidden';
      input.name = nom;
      input.value = valeur || '';
      formulaireCache.appendChild(input);
    };
    
    ajouterChamp('id', donnees.id);
    ajouterChamp('horodatage', donnees.horodatage);
    ajouterChamp('donnees_json', JSON.stringify(donnees));
    
    // Ajouter toutes les réponses individuellement
    Object.entries(donnees.reponses).forEach(([cle, valeur]) => {
      if (Array.isArray(valeur)) {
        ajouterChamp(cle, valeur.join(' • '));
      } else if (valeur !== undefined && valeur !== null) {
        ajouterChamp(cle, String(valeur));
      }
    });
    
    // Envoyer
    document.body.appendChild(formulaireCache);
    formulaireCache.submit();
    document.body.removeChild(formulaireCache);
    
    console.log("Réponse envoyée ✓");
    
    // Petit délai pour laisser le formulaire partir avant d'afficher le merci
    setTimeout(() => afficherRemerciement(), 500);
    
  } else {
    // Pas de centralisation configurée
    afficherRemerciement();
  }
}

function distribution(reponses, cle) {
  const compteurs = {};
  reponses.forEach(r => {
    const v = r.reponses[cle];
    if (v === undefined || v === null || v === '') return;
    if (Array.isArray(v)) v.forEach(x => compteurs[x] = (compteurs[x]||0)+1);
    else compteurs[v] = (compteurs[v]||0)+1;
  });
  return compteurs;
}

function moyenne(reponses, cle) {
  const vals = reponses.map(r => r.reponses[cle]).filter(v => typeof v === 'number');
  return vals.length ? (vals.reduce((a,b)=>a+b,0)/vals.length) : null;
}

function afficherBarres(compteurs, total) {
  const entrees = Object.entries(compteurs).sort((a,b)=>b[1]-a[1]);
  if (entrees.length === 0) return `<p style="color:var(--text-3);font-size:13px">${LIBELLES.texteAucuneDonnee}</p>`;
  return entrees.map(([label, n]) => {
    const pct = total ? Math.round(n/total*100) : 0;
    return `<div class="q-bar-row">
      <span class="q-bar-label">${label}</span>
      <div class="q-bar-track"><div class="q-bar-fill" style="width:${pct}%"></div></div>
      <span class="q-bar-val">${n} · ${pct}%</span>
    </div>`;
  }).join('');
}

function carteBarres(titre, compteurs, n) {
  return `<div class="q-card"><h3 style="font-size:14px;font-weight:500;margin:0 0 0.75rem">${titre}</h3>${afficherBarres(compteurs, n)}</div>`;
}

function afficherVueEnsemble(reponses) {
  const n = reponses.length;
  const interet = moyenne(reponses, 'interet_global');
  const recommandation = moyenne(reponses, 'recommanderais');
  const appImp = moyenne(reponses, 'app_importance');
  
  return `
    <div class="q-metric-grid">
      <div class="q-metric"><div class="q-metric-label">${LIBELLES.metriqueReponses}</div><div class="q-metric-val">${n}</div></div>
      <div class="q-metric"><div class="q-metric-label">${LIBELLES.metriqueInteret}</div><div class="q-metric-val">${interet?interet.toFixed(1):'-'}</div></div>
      <div class="q-metric"><div class="q-metric-label">${LIBELLES.metriqueRecommandation}</div><div class="q-metric-val">${recommandation?recommandation.toFixed(1):'-'}</div></div>
      <div class="q-metric"><div class="q-metric-label">${LIBELLES.metriqueApp}</div><div class="q-metric-val">${appImp?appImp.toFixed(1):'-'}</div></div>
    </div>
    ${carteBarres("Formule préférée", distribution(reponses, 'formule_preferee'), n)}
    ${carteBarres("Frein principal", distribution(reponses, 'frein_principal'), n)}
    ${carteBarres("Statut perçu", distribution(reponses, 'statut_perso'), n)}
  `;
}

function afficherProfils(reponses) {
  const n = reponses.length;
  return `
    ${carteBarres("Âge", distribution(reponses, 'age'), n)}
    ${carteBarres("Genre", distribution(reponses, 'genre'), n)}
    ${carteBarres("Niveau", distribution(reponses, 'niveau'), n)}
    ${carteBarres("Heures par semaine", distribution(reponses, 'frequence'), n)}
    ${carteBarres("Ancienneté", distribution(reponses, 'anciennete'), n)}
    ${carteBarres("Revenus sport", distribution(reponses, 'revenus_sport'), n)}

    ${carteBarres("Budget potentiel (volonté de payer)", distribution(reponses, 'budget_potentiel'), n)}
    ${carteBarres("Accompagnement actuel", distribution(reponses, 'accompagnement_actuel'), n)}
    ${carteBarres("Manques actuels", distribution(reponses, 'manques'), n)}

}

    <div class="q-metric-grid">

      <div class="q-metric"><div class="q-metric-label">${LIBELLES.metriquePrixJuste}</div><div class="q-metric-val">${prixJuste?Math.round(prixJuste)+'€':'-'}</div></div>
      <div class="q-metric"><div class="q-metric-label">${LIBELLES.metriquePrixDoute}</div><div class="q-metric-val">${prixDoute?Math.round(prixDoute)+'€':'-'}</div></div>
    </div>
    ${carteBarres("Perception tarif Reconnaissance", distribution(reponses, 'tarif_reconnaissance'), n)}

    ${carteBarres("Différenciation Pro justifiée ?", distribution(reponses, 'differenciation_pro'), n)}
    ${carteBarres("Mode d'engagement préféré", distribution(reponses, 'engagement'), n)}

function afficherAvantages(reponses) {
  const n = reponses.length;
  return `

    ${carteBarres("Briefing 2h perçu comme", distribution(reponses, 'briefing_2h'), n)}

    ${carteBarres("Garantie rassurante", distribution(reponses, 'garantie'), n)}

function afficherVerbatims(reponses) {
  const items = reponses.map(r => ({
    ts: r.horodatage,
    discipline: r.reponses.discipline,
    niveau: r.reponses.niveau,
    concurrents: r.reponses.concurrents,
    feature_manquante: r.reponses.feature_manquante,
    verbatim: r.reponses.verbatim,
    contact: r.reponses.contact
  })).filter(x => x.verbatim || x.feature_manquante || x.concurrents || x.contact);
  
  if (items.length === 0) return `<div class="q-card" style="text-align:center;color:var(--text-3)">${LIBELLES.texteAucunVerbatim}</div>`;
  
  return items.map(it => `
    <div class="q-card">
      <p style="font-size:11px;color:var(--text-3);margin:0 0 0.5rem">${new Date(it.ts).toLocaleString('fr-FR')} · ${it.discipline||'?'} · ${it.niveau||'?'}</p>
      ${it.verbatim ? `<p style="margin:0 0 0.5rem;font-size:13px;line-height:1.6"><strong>Remarque :</strong> ${it.verbatim}</p>` : ''}
      ${it.feature_manquante ? `<p style="margin:0 0 0.5rem;font-size:13px;line-height:1.6"><strong>Fonctionnalité suggérée :</strong> ${it.feature_manquante}</p>` : ''}
      ${it.concurrents ? `<p style="margin:0 0 0.5rem;font-size:13px;line-height:1.6"><strong>Concurrents utilisés :</strong> ${it.concurrents}</p>` : ''}
      ${it.contact ? `<p style="margin:0;font-size:12px;color:var(--accent)"><i class="ti ti-mail"></i> ${it.contact}</p>` : ''}
    </div>
  `).join('');
}

function afficherBrut(reponses) {
  return `<div class="q-card"><pre style="font-size:11px;overflow-x:auto;font-family:monospace;background:var(--surface-2);padding:0.75rem;border-radius:var(--radius);max-height:500px;overflow-y:auto">${JSON.stringify(reponses, null, 2)}</pre></div>`;
}

window.exporterCSV = function() {
  const reponses = window._reponses || [];
  if (reponses.length === 0) return afficherMessage("Aucune réponse à exporter");
  const toutesCles = new Set();
  reponses.forEach(r => Object.keys(r.reponses).forEach(k => toutesCles.add(k)));
  const cles = ['id','horodatage', ...Array.from(toutesCles)];
  const lignes = [cles.join(',')];
  reponses.forEach(r => {
    const ligne = cles.map(k => {
      let v = k === 'id' ? r.id : k === 'horodatage' ? r.horodatage : r.reponses[k];
      if (Array.isArray(v)) v = v.join('|');
      if (v === undefined || v === null) v = '';
      v = String(v).replace(/"/g, '""');
      return `"${v}"`;
    });
    lignes.push(ligne.join(','));
  });
  telecharger('altagon_reponses_' + Date.now() + '.csv', '\uFEFF' + lignes.join('\n'), 'text/csv;charset=utf-8');
};

window.exporterJSON = function() {
  const reponses = window._reponses || [];
  telecharger('altagon_reponses_' + Date.now() + '.json', JSON.stringify(reponses, null, 2), 'application/json');
};

window.importerJSON = function(event) {
  const fichier = event.target.files[0];
  if (!fichier) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const importees = JSON.parse(e.target.result);
      if (!Array.isArray(importees)) throw new Error("Format invalide");
      const actuelles = chargerReponses();
      const idsExistants = new Set(actuelles.map(r => r.id));
      const nouvelles = importees.filter(r => !idsExistants.has(r.id));
      const fusionnees = [...actuelles, ...nouvelles];
      localStorage.setItem(STORAGE_KEY, JSON.stringify(fusionnees));
      afficherMessage(`${LIBELLES.texteImportReussi} (${nouvelles.length} nouvelles)`);
      afficherTableauBord();
    } catch(e) {
      afficherMessage("Erreur d'import : " + e.message);
    }
  };
  reader.readAsText(fichier);
};

function telecharger(nom, contenu, type) {
  const blob = new Blob([contenu], {type});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = nom; a.click();
  URL.revokeObjectURL(url);
  afficherMessage(LIBELLES.texteExportTelecharge);
}

window.toutSupprimer = function() {
  localStorage.removeItem(STORAGE_KEY);
  afficherMessage(LIBELLES.texteToutesReponsesSupprimees);
  afficherTableauBord();
};

// --- Initialisation ---
if (estAdmin) afficherTableauBord();
else afficherQuestionnaire();
</script>
